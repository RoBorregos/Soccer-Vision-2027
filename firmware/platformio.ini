; How to execute this project
; From platformIO new terminal (Ctrl+Shift+P) and select "PlatformIO: New Terminal"
; Then run the following command to build and upload the code to the Teensy board:
;
; ```bash
; # Striker
; pio run -e striker -t upload
; ``` 
;
; ```bash
; # Goalie
; pio run -e goalie -t upload
; ``` 
; For more information, refer to the PlatformIO documentation: https://docs.platformio.org/en/latest/ide/atom.html

[platformio]
default_envs = striker

[env:teensy]
platform          = teensy
board             = teensy41
framework         = arduino
monitor_speed     = 115200
board_build.f_cpu = 600000000L # 600 MHz recommended for Teensy 4.1
build_unflags     = -std=gnu++14
build_flags       = -std=gnu++17
lib_extra_dirs    = lib

[env:striker]
extends = env:teensy
build_src_filter = -<*> +<striker.cpp> 

[env:goalie]
extends = env:teensy
build_src_filter = -<*> +<goalie.cpp> 

[env:test-motor]
extends = env:teensy
build_src_filter = -<*> +<tests/test_motor/test_motor.cpp>
lib_extra_dirs    = lib/hardware, lib/software 
build_flags       = ${env:teensy.build_flags}
                    -Ilib/hardware
                    -Ilib/software/MotorInterface

[env:BNO085]
extends = env:teensy
build_src_filter = -<*> +<tests/test_BNO085/yawAngle.cpp>
lib_extra_dirs    = lib/hardware, lib/software 
lib_deps =
    adafruit/Adafruit BNO08x
    adafruit/Adafruit BusIO

[env:esp32]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
build_unflags     = -std=gnu++14
build_flags       = -std=gnu++17
lib_extra_dirs    = lib

[env:arduino]
platform          = atmelavr
board             = megaatmega2560
framework         = arduino
monitor_speed     = 115200
build_unflags     = -std=gnu++14
build_flags       = -std=gnu++17
lib_extra_dirs    = lib