[platformio]
default_envs = striker

[env:teensy]
platform          = teensy
board             = teensy41
framework         = arduino
monitor_speed     = 115200
board_build.f_cpu = 600000000L # 600 MHz recommended for Teensy 4.1
build_unflags     = -std=gnu++14

build_flags       = -std=gnu++17
                    -Ilib/hardware
                    -Ilib/hardware/BNO085
                    -Ilib/hardware/camera
                    -Ilib/hardware/motor
                    -Ilib/hardware/motors
                    -Ilib/software/helpers
                    -Ilib/software/IMUInterface
                    -Ilib/software/MotorInterface
                    -Ilib/software/PIDController
lib_extra_dirs    = lib/hardware, lib/software

[env:striker]
extends = env:teensy
build_src_filter = -<*> +<striker.cpp> 

[env:goalie]
extends = env:teensy
build_src_filter = -<*> +<goalie.cpp> 

[env:test-motor]
extends = env:teensy
build_src_filter = -<*> +<tests/test_motor/test_motor.cpp>

[env:test-motors]
extends = env:teensy
build_src_filter = -<*> +<tests/test_motors/test_motors.cpp>

[env:BNO085]
extends = env:teensy
build_src_filter = -<*> +<tests/test_BNO085/yawAngle.cpp>
lib_deps =
    adafruit/Adafruit BNO08x
    adafruit/Adafruit BusIO

[env:test-heading]
extends = env:teensy
build_src_filter = -<*> +<tests/test_heading/test_heading.cpp>
lib_deps =
    adafruit/Adafruit BNO08x
    adafruit/Adafruit BusIO

[env:test-cameraball-v1]
extends = env:teensy
build_src_filter = -<*> +<tests/test_camera/test_camera_ball_v1.cpp>

[env:test-cameraball-v2]
extends = env:teensy
build_src_filter = -<*> +<tests/test_camera/test_camera_ball_v2.cpp>

[env:test-cameraraw]
extends = env:teensy
build_src_filter = -<*> +<tests/test_camera/test_camera_raw.cpp>

[env:test-serialscan]
extends = env:teensy
build_src_filter = -<*> +<tests/test_camera/test_serial_scan.cpp>

[env:test-serial]
extends = env:teensy
build_src_filter = -<*> +<tests/test_serial/test_serial.cpp>

[env:esp32]
platform          = espressif32
board             = esp32dev
framework         = arduino
monitor_speed     = 115200
build_unflags     = -std=gnu++14
build_flags       = -std=gnu++17
lib_extra_dirs    = lib

[env:arduino]
platform          = atmelavr
board             = megaatmega2560
framework         = arduino
monitor_speed     = 115200
build_unflags     = -std=gnu++14
build_flags       = -std=gnu++17
lib_extra_dirs    = lib